[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopi"
version = "0.2.4"
description = "AutoPI: a taxonomy-driven, adaptive prompt-injection attacker and evaluation harness for LLM agents, generalized across benchmarks and models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "requests>=2.31",
]

# Benchmark backends and model providers are optional extras so the core engine
# stays light and a user installs only the benchmarks/providers they need.
# The README installs the two bundled benchmark snapshots from benchmarks/.
[project.optional-dependencies]
agentdojo = ["agentdojo==0.1.35"]
recovery = ["tokenizers>=0.20"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autopi = "autopi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autopi"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "benchmarks/", "configs/", "docs/", "examples/", "scripts/", ".github/", "README.md", "LICENSE", "THIRD_PARTY.md", "CITATION.cff", "pyproject.toml", "requirements-tested.txt"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/*.pyc", "configs/*.local.yaml", "**/.DS_Store"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
