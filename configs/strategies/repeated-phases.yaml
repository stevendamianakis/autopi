# An illustrative research strategy, not one of the paper's measured runs.
version: 1
budget: 80
stop: budget
blocks:
  - kind: seed
  - kind: seed_exploit
    reps: 4
  - kind: sweep
    id: first_sweep
    level: 1
    techniques: [F1, F2]
    order: random
    order_seed: 42
    limit: 12
  - kind: sweep_exploit
    source: first_sweep
    reps: 2
  - kind: sweep
    id: second_sweep
    level: 2
    # Five sub-techniques of two techniques give ten pairs, six of them across the two techniques.
    techniques: [F1.T2.S1, F1.T2.S2, F1.T2.S3, F2.T5.S1, F2.T5.S2]
    order: canonical
    limit: 10
  - kind: sweep_exploit
    source: second_sweep
    reps: 2
  - kind: seed_exploit
    reps: 4
