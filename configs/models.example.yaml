# Copy to models.local.yaml and set the actual model ids/URLs before running.
# API secrets are read from environment variables, never stored in this file.
#
# Targets call tools natively (tool_mode: native, the default), as AgentDojo runs models
# with tool support, so serve the model WITH the tool-call parser that matches it:
#   vllm serve MODEL --enable-auto-tool-choice --tool-call-parser <parser for the model>
# One such server can serve every alias below. For AgentDojo's prompted tools instead
# (tool_mode: prompted, or --tool-calling prompted), point that target at a second server
# started WITHOUT --enable-auto-tool-choice. See docs/models.md, "Serving a vLLM target".
models:
  target:
    provider: openai-compatible
    model: YOUR_SERVED_MODEL_ID
    base_url: http://localhost:8000/v1
    tool_mode: native
    thinking: "off"
    temperature: 0.0
    top_p: 0.9
    timeout: 240
    # A prompted target (tool_mode: prompted) behind a parser that strips its tool text:
    # tokenizer_path: /path/to/exact/served/tokenizer.json

  # AutoPI's judge, which diagnoses failed attempts, runs on this alias too unless
  # --autopi-judge names another one (with the same fields as this alias).
  generator:
    provider: openai-compatible
    model: YOUR_SERVED_GENERATOR_MODEL_ID
    base_url: http://localhost:8000/v1
    thinking: "off"
    temperature: 0.7
    max_tokens: 1024
    timeout: 240
    # tokenizer_path: /path/to/exact/served/tokenizer.json

  arena-target:
    provider: openai-compatible
    model: YOUR_SERVED_MODEL_ID
    base_url: http://localhost:8000/v1
    tool_mode: native
    thinking: "off"
    temperature: 0.0
    max_tokens: 4096
    timeout: 1200

  # IPI Arena's scoring judge (--ipi-judge, and here --ipi-worldsim too), part of the
  # benchmark's own scoring. It is not AutoPI's judge (--autopi-judge).
  arena-judge:
    provider: openai-compatible
    model: YOUR_SERVED_JUDGE_MODEL_ID
    base_url: http://localhost:8000/v1
    tool_mode: native
    thinking: "off"
    timeout: 1200

  # A hosted target can use a completely different provider and model.
  hosted-example:
    provider: openai
    model: YOUR_API_MODEL_ID
    api_key_env: OPENAI_API_KEY
    thinking: server
    tool_mode: native

  # An OpenAI o-series reasoning model. These take the output cap only as max_completion_tokens and
  # reject a temperature other than the default, so set the field name and omit temperature. Works
  # for the target, the generator and IPI Arena's clients. The cap counts reasoning tokens, so give a
  # generator a larger max_tokens than the 1,024 default. A model that supports tool calling only
  # through OpenAI's Responses API cannot be a target (every client here uses Chat Completions).
  openai-reasoning-example:
    provider: openai
    model: YOUR_REASONING_MODEL_ID
    api_key_env: OPENAI_API_KEY
    thinking: server
    tool_mode: native
    max_tokens_field: max_completion_tokens
    omit_parameters: [temperature]
